prefixes:
  - "!"

discord:
  token: "<discord token>"
  enabled: false
  prefix: "!"
  invite: "https://discord.gg/GCKtG4erux"
  roles:
    trusted: "trusted"
    admin: "admin"
    owner: "NitoriBot Owner"

core:
  itemRefill: true
  area:
    start:
      x: 0
      y: 0
      z: 0
    end:
      x: 15
      y: 0
      z: 15
  coreName: "[{text:\"Nitori\",color:\"blue\"},{text:\"Bot \",color:\"green\"},{text:\"Core\"}]"

keys:
  trusted: "<key>"
  admin: "<key>"
  owner: "<key>"


colors:
  integer: "gold"
  commands:
    primary: "blue"
    secondary: "dark_aqua"
    tertiary: "aqua"
  help:
    Public: "blue"
    trusted: "dark_aqua"
    admin: "aqua"
    owner: "light_purple"
    console: "dark_purple"

console:
  prefix: "c."

bots:
  - host: "localhost"
    port: 25565
    useProxy: false
    isPrivate: false
    serverName: "kaboom"
    username: "NitoriBotJava"
    discordChannelId: "<discord channel id>"
    reconnectDelay: 6000
    selfcareInterval: 1000
    mode: "kaboom"